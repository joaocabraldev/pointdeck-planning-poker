paths:
  /rooms:
    post:
      tags:
        - Rooms
      summary: Create a new poker planning room
      description: Creates a new room. The creator automatically becomes the owner and first participant.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Optional room name
                  example: Sprint Planning Room
      responses:
        '200':
          description: Room created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id:
                    type: string
                    description: Unique room identifier
                    example: 01HXYZ987ZYX654WVU321TSR
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rooms/{id}:
    get:
      tags:
        - Rooms
      summary: Get room state
      description: Retrieves complete room information including participants, votes, and voting status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Room ID
      responses:
        '200':
          description: Room state retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

  /rooms/{id}/join:
    post:
      tags:
        - Rooms
      summary: Join a poker planning room
      description: Adds the authenticated user to the room's participant list
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Room ID
      responses:
        '200':
          description: Successfully joined the room
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

  /rooms/{id}/voting/start:
    post:
      tags:
        - Voting
      summary: Start a voting session
      description: Starts a new voting session. Only the room owner can start voting. Clears any previous votes.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Room ID
      responses:
        '200':
          description: Voting session started successfully
        '400':
          description: Voting is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the room owner can start voting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found
        '401':
          description: Unauthorized

  /rooms/{id}/votes:
    post:
      tags:
        - Voting
      summary: Submit or update a vote
      description: Submit a vote for the active voting session. Only valid when voting status is "active". Vote values must be XS, S, M, or L.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Room ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vote
              properties:
                vote:
                  type: string
                  enum: [XS, S, M, L]
                  description: Vote value (XS=Extra Small, S=Small, M=Medium, L=Large)
                  example: M
      responses:
        '200':
          description: Vote recorded successfully
        '400':
          description: Invalid vote or voting not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notActive:
                  value:
                    error: "Voting is not active"
                invalidVote:
                  value:
                    error: "Invalid vote. Must be one of: XS, S, M, L"
        '403':
          description: User must join the room first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found
        '401':
          description: Unauthorized
    delete:
      tags:
        - Voting
      summary: Cancel your vote
      description: Removes the user's vote from the current voting session. Only valid when voting is active.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Room ID
      responses:
        '200':
          description: Vote cancelled successfully
        '400':
          description: Voting is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found
        '401':
          description: Unauthorized

  /rooms/{id}/voting/close:
    post:
      tags:
        - Voting
      summary: Close voting and reveal results
      description: Closes the active voting session and reveals all votes. Only the room owner can close voting.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Room ID
      responses:
        '200':
          description: Voting closed successfully
        '400':
          description: Voting is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the room owner can close voting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found
        '401':
          description: Unauthorized

  /rooms/{id}/voting/reset:
    post:
      tags:
        - Voting
      summary: Reset voting session
      description: Resets the voting session to idle state, clearing all votes while keeping participants and room configuration. Only the room owner can reset.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Room ID
      responses:
        '200':
          description: Voting reset successfully
        '403':
          description: Only the room owner can reset voting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found
        '401':
          description: Unauthorized

  /rooms/{id}/agreed-value:
    post:
      tags:
        - Voting
      summary: Set the agreed estimate value
      description: Records the consensus estimate (agreed value) after voting is closed. Only the room owner can set the agreed value.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Room ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  enum: [XS, S, M, L]
                  description: Agreed estimate value (XS=Extra Small, S=Small, M=Medium, L=Large)
                  example: M
      responses:
        '200':
          description: Agreed value set successfully
        '400':
          description: Invalid value or voting not closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidValue:
                  value:
                    error: "Invalid value. Must be one of: XS, S, M, L"
                notClosed:
                  value:
                    error: "Voting must be closed before setting agreed value"
        '403':
          description: Only the room owner can set the agreed value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Room not found
        '401':
          description: Unauthorized
